<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用说明</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .custom-content {
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }
        .content-text {
            font-size: 16px;
            color: #333;
            line-height: 1.75;
        }
        .content-text br {
            display: none;
        }
        .content-text img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .guide-section {
            margin: 24px 0;
        }
        .guide-section h3 {
            margin: 0 0 16px;
            color: #26364a;
            font-size: 22px;
        }
        .guide-section--primary {
            padding: 22px 24px;
            border-left: 5px solid #2f6fed;
            background: #ffffff;
        }
        .guide-section--primary h3 {
            color: #1e56bd;
        }
        .guide-section--extra {
            padding-top: 28px;
            border-top: 2px solid #d8e0ea;
        }
        .guide-section--extra h3 {
            color: #506176;
        }
        .guide-section ul,
        .guide-section ol {
            padding-left: 28px;
        }
        .guide-section li {
            margin: 8px 0;
        }
        .img-container {
            text-align: center;
            margin: 20px 0;
        }
        .img-container img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .warning-box {
            background-color: #fff3cd;
            padding: 12px 16px;
            border-left: 4px solid #d8a62b;
            border-radius: 6px;
            font-weight: bold;
        }
        .purchase-notice {
            margin: 8px 0;
            padding: 26px 24px;
            color: #26364a;
            background: #f4f7fb;
            border-left: 4px solid #d8a62b;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.75;
            text-align: center;
        }
        /* 全集包的关键跳转步骤：说明和操作并列，醒目但不打断阅读节奏。 */
        .home-return-step {
            margin: 16px 0;
            padding: 0;
        }
        .home-return-step::marker {
            color: #3f6fb5;
            font-weight: 700;
        }
        .home-return-panel {
            padding: 16px 18px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            background: #edf4ff;
            border: 1px solid #bfd0ee;
            border-left: 4px solid #3f6fb5;
            border-radius: 6px;
            color: #27384f;
        }
        .home-return-copy strong,
        .home-return-copy span {
            display: block;
        }
        .home-return-copy strong {
            margin-bottom: 2px;
            color: #203653;
            font-size: 17px;
        }
        .home-return-copy span {
            color: #5a6b80;
            font-size: 14px;
        }
        .home-return-panel a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 108px;
            padding: 10px 16px;
            color: #ffffff;
            background: #3f6fb5;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 3px 8px rgba(42, 77, 128, 0.18);
        }
        .home-return-panel a:hover {
            color: #ffffff;
            background: #315c9b;
            text-decoration: none;
        }
        @media (max-width: 576px) {
            .container {
                margin: 0;
                padding: 22px 16px;
                border-radius: 0;
            }
            .custom-content {
                padding: 16px;
            }
            .home-return-panel {
                grid-template-columns: 1fr;
            }
            .home-return-panel a {
                justify-self: start;
            }
        }
        .error-text {
            text-align: center;
            color: #dc3545;
            margin-top: 40px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">加载中...</h1>
        <div class="img-container">
            <img id="page-image" src="" alt="商品图片" style="display:none;">
        </div>
        <h2 class="card-title text-center">使用说明</h2>
        <div class="custom-content">
            <div id="note-content" class="content-text">
                <p>正在加载...</p>
            </div>
        </div>
        <a href="./" class="back-link">← 返回首页</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const purchaseOnly = urlParams.get('purchase') === '1';

        if (!productId) {
            document.getElementById('page-title').textContent = '参数错误';
            document.getElementById('note-content').innerHTML = '<p class="error-text">缺少商品 ID 参数。</p>';
        } else {
            fetch('data/products.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    const all = data.products || [];
                    const item = all.find(p => p.id === productId);

                    if (!item) {
                        document.getElementById('page-title').textContent = '未找到商品';
                        document.getElementById('note-content').innerHTML =
                            `<p class="error-text">未找到 ID 为 "${productId}" 的商品。</p>`;
                        return;
                    }

                    document.title = item.title + ' - 使用说明';
                    document.getElementById('page-title').textContent = item.title;

                    const img = document.getElementById('page-image');
                    if (purchaseOnly && item.includedInBundle) {
                        document.title = item.title + ' - 购买说明';
                        document.getElementById('page-title').textContent = `${item.category} 本地化 Demo`;
                        document.querySelector('.card-title').textContent = '购买说明';
                        document.getElementById('note-content').innerHTML =
                            `<div class="purchase-notice">本项目体量较小，不单独售卖，已作为 ${item.category} 全集包和全引擎全集包的附赠内容提供。</div>`;
                        return;
                    }

                    img.src = item.image;
                    img.style.display = 'block';

                    const accessTip = item.includedInBundle
                        ? `提示：本项目体量较小，不单独售卖，已作为 ${item.category} 全集包和全引擎全集包的附赠内容提供`
                        : item.category === 'Collection'
                            ? '提示：购买全集包后，可获取包内各项目对应的解压密码'
                            : '提示：项目无法直接打开，需在店铺购买后，获取项目解压密码';
                    let noteHtml = `<p class="warning-box">${accessTip}</p>`;
                    noteHtml += item.note || '<p>暂无使用说明。</p>';
                    document.getElementById('note-content').innerHTML = noteHtml;

                })
                .catch(err => {
                    console.error('加载数据失败:', err);
                    document.getElementById('page-title').textContent = '加载失败';
                    document.getElementById('note-content').innerHTML =
                        '<p class="error-text">加载数据失败，请刷新重试。</p>';
                });
        }
    </script>
</body>
</html>
